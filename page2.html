<!DOCTYPE html>
<html>
    <head>
        <title>校园知识网络</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <center>
            <img src="chuandapicture1.jpg" alt="Test Image" width="500" height="400"/>
            <h1 name="title">欢迎来到校园知识网！</h1>
            <p title="录入">录入你的信息</p>
            <form>姓名：<input type="text" name="name"></form>
            <form>性别：<input list="gender"></form>

                <option value="男"></option>

            </datalist>
            <datalist id="college">
                <option value="计算机学院"></option>
                <option value="法学院"></option>
                <option value="人工智能学院"></option>
                <option value="历史学院"></option>
                <option value="经济学院"></option>
                <option value="马克思主义学院"></option>
                <option value="化学学院"></option>
                <option value="建筑学院"></option>
            </datalist>
            <button id="btn5">点击录入</button>
            <script src="script.js"></script>
            <a href="index.html"><button id="btn6">返回首页</button></a>
            
        </center>
    </body>
</html>
